services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: biletsatis-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:?DB_SA_PASSWORD .env dosyasında tanımlanmalı}"
    ports:
      - "1433:1433"
    volumes:
      - biletsatis-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: BiletSatis.Web/Dockerfile
    container_name: biletsatis-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=db;Database=BiletSatisDb;User Id=sa;Password=${DB_SA_PASSWORD:?DB_SA_PASSWORD .env dosyasında tanımlanmalı};TrustServerCertificate=True"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY .env dosyasında tanımlanmalı}"

      # Bilet QR kodlarının imza anahtarı. Üretim ortamında tanımlı değilse uygulama
      # bilinçli olarak başlamaz — anahtarsız imza tahmin edilebilir olur ve sahte
      # bilet üretilebilir.
      Giris__ImzaAnahtari: "${GIRIS_IMZA_ANAHTARI:?GIRIS_IMZA_ANAHTARI .env dosyasında tanımlanmalı}"

      # Yönetici hesabı. Tanımlı değilse hesap hiç oluşturulmaz ve yönetim paneline
      # kimse giremez; koda gömülü şifreyle hesap açmak üretimde kabul edilemez.
      Yonetici__Eposta: "${YONETICI_EPOSTA:?YONETICI_EPOSTA .env dosyasında tanımlanmalı}"
      Yonetici__Sifre: "${YONETICI_SIFRE:?YONETICI_SIFRE .env dosyasında tanımlanmalı}"
    ports:
      - "8080:8080"

volumes:
  biletsatis-db-data:
